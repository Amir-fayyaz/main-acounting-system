packages:
  - apps/*
  - packages/*

# ---------------------------------------------------------------------------
# pnpm catalogs — single source of truth for every shared dependency version.
# Reference these from any workspace package with the `catalog:` protocol,
# e.g. `"react": "catalog:"`. Bump a version once here instead of in N files.
# ---------------------------------------------------------------------------
catalog:
  # --- Framework / runtime -------------------------------------------------
  next: "16.2.5"
  react: "19.2.4"
  react-dom: "19.2.4"

  # --- Forms / validation / state -----------------------------------------
  react-hook-form: "^7.91.0"
  zod: "^4.4.3"
  zustand: "^5.0.15"

  # --- UI primitives -------------------------------------------------------
  "@radix-ui/react-checkbox": "^1.3.3"
  "@radix-ui/react-dialog": "^1.1.15"
  "@radix-ui/react-dropdown-menu": "^2.1.16"
  "@radix-ui/react-select": "^2.2.6"
  "@radix-ui/react-separator": "^1.1.15"
  "@radix-ui/react-slot": "^1.2.4"
  "@radix-ui/react-tooltip": "^1.2.16"
  radix-ui: "^1.6.7"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  tailwind-merge: "^3.6.0"
  lucide-react: "^1.39.0"
  react-icons: "^5.7.0"
  sonner: "^2.0.8"
  input-otp: "^1.4.2"
  swiper: "^14.2.0"
  nextjs-toploader: "^3.9.17"
  use-debounce: "^10.1.1"
  tw-animate-css: "^1.4.0"

  # --- Data table / drag & drop (owned by @repo/web) ----------------------
  "@tanstack/react-table": "^8.21.3"
  "@tanstack/react-virtual": "^3.14.26"
  "@dnd-kit/core": "^6.3.1"
  "@dnd-kit/sortable": "^10.0.0"

  # --- Styling pipeline ----------------------------------------------------
  tailwindcss: "^4"
  "@tailwindcss/postcss": "^4"
  tailwindcss-animate: "^1.0.7"

  # --- Linting / type checking --------------------------------------------
  eslint: "^9.39.5"
  eslint-config-next: "^16.3.6"
  typescript: "^5.9.3"
  "@types/node": "^24.19.0"
  "@types/react": "^19"
  "@types/react-dom": "^19"

  # --- Testing -------------------------------------------------------------
  vitest: "^5.0.0"
  jsdom: "^30.0.1"
  "@testing-library/react": "^16.3.3"
  "@testing-library/jest-dom": "^7.0.1"
  "@testing-library/user-event": "^14.6.7"
  "@opentelemetry/api": "^1.10.0"

  # --- Storybook -----------------------------------------------------------
  storybook: "^10.6.1"
  "@storybook/nextjs-vite": "^10.6.1"
  "@storybook/addon-a11y": "^10.6.1"
  "@storybook/addon-docs": "^10.6.1"
  "@storybook/addon-onboarding": "^10.6.1"
  "@storybook/addon-vitest": "^10.6.1"
  "@chromatic-com/storybook": "^5.4.0"
  eslint-plugin-storybook: "^10.6.1"

  # --- Scripts / runners ---------------------------------------------------
  tsx: "^4.23.15"

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
