name: CI

on:
  pull_request:
  push:
    branches: [main]

# runهای قدیمی‌ترِ همون PR/branch کنسل میشن
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# حداقل دسترسی
permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------
  # 1) تشخیص اینکه کدوم اپ‌ها تغییر کردن
  # ---------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontends: ${{ steps.matrix.outputs.frontends }}
      has_frontends: ${{ steps.matrix.outputs.has_frontends }}
      backend: ${{ steps.matrix.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'apps/frontend/**'
            web-admin:
              - 'apps/web-admin/**'
            web-business:
              - 'apps/web-business/**'
            backend:
              - 'apps/backend/**'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
            observability:
              - 'infrastructure/observability/**'
              - 'docker-compose.yml'
              - 'tooling/scripts/obs.mjs'
              - 'tooling/scripts/obs/**'
              - 'tooling/scripts/check-observability.mjs'

      - name: Build job matrix
        id: matrix
        env:
          FILTER: ${{ toJSON(steps.filter.outputs) }}
        run: |
          shared=$(jq -r '.shared' <<< "$FILTER")

          # اگه کد مشترک تغییر کرده، همه‌ی اپ‌ها اجرا میشن
          frontends=$(
            for app in frontend web-admin web-business; do
              changed=$(jq -r --arg a "$app" '.[$a]' <<< "$FILTER")
              if [ "$shared" = "true" ] || [ "$changed" = "true" ]; then echo "$app"; fi
            done | jq -R . | jq -sc .
          )
          backend=$(jq -r '.backend' <<< "$FILTER")
          [ "$shared" = "true" ] && backend=true

          echo "frontends=$frontends" >> "$GITHUB_OUTPUT"
          echo "has_frontends=$([ "$frontends" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

          echo "Frontends to run: $frontends"
          echo "Backend: $backend"

  # ---------------------------------------------------------------
  # 2) Frontendها (Next.js) - هر اپ یه job جدا
  # ---------------------------------------------------------------
  frontend:
    name: Frontend / ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.has_frontends == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontends) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup & install
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm --filter "./apps/${{ matrix.app }}" run lint

      - name: Type check
        run: pnpm --filter "./apps/${{ matrix.app }}" exec tsc --noEmit

      - name: Unit test
        run: pnpm --filter "./apps/${{ matrix.app }}" run test

      - name: Build
        run: pnpm --filter "./apps/${{ matrix.app }}" run build

  # ---------------------------------------------------------------
  # 3) Backend (NestJS)
  # ---------------------------------------------------------------
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup & install
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm --filter "./apps/backend" run lint

      - name: Type check
        run: pnpm --filter "./apps/backend" exec tsc --noEmit

      - name: Dependency check (cycles and module boundaries)
        run: pnpm --filter "./apps/backend" run deps:check

      - name: Unit test
        run: pnpm --filter "./apps/backend" run test

      - name: Build
        run: pnpm --filter "./apps/backend" run build

  # ---------------------------------------------------------------
  # 4) Dockerfile lint
  # ---------------------------------------------------------------
  dockerfile-lint:
    name: Dockerfile lint
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hadolint
        run: |
          status=0
          while IFS= read -r file; do
            echo "::group::hadolint $file"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint - < "$file" || status=1
            echo "::endgroup::"
          done < <(find . -name Dockerfile -not -path '*/node_modules/*')
          exit $status

  # ---------------------------------------------------------------
  # 5) Observability stack config (FND-017): promtool checks, rule
  #    tests (firing + non-firing per alert), compose config and the
  #    no-secrets/localhost static check
  # ---------------------------------------------------------------
  observability:
    name: Observability config
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # promtool validates the config and both rule files with the exact
      # version the stack runs, so review and runtime never disagree.
      - name: promtool check config and rules
        run: |
          # The scrape-token file is a start-up artifact (git-ignored); the
          # config check only needs the path to exist.
          mkdir -p infrastructure/observability/runtime
          : > infrastructure/observability/runtime/metrics_token

          docker run --rm \
            -v "$PWD/infrastructure/observability/prometheus:/etc/prometheus" \
            -v "$PWD/infrastructure/observability/alerts:/etc/prometheus/alerts" \
            -v "$PWD/infrastructure/observability/runtime:/run/secrets" \
            --entrypoint promtool prom/prometheus:v3.16.0 \
            check config /etc/prometheus/prometheus.yml

          docker run --rm \
            -v "$PWD/infrastructure/observability/alerts:/alerts" \
            --entrypoint promtool prom/prometheus:v3.16.0 \
            check rules /alerts/rules.yml

      # One firing and one non-firing case per alert, driven by synthetic
      # series — thresholds and `for` windows proven without infrastructure.
      - name: promtool test rules
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/observability/alerts:/alerts" \
            --entrypoint promtool prom/prometheus:v3.16.0 \
            test rules /alerts/rules.spec.yml

      - name: docker compose --profile observability config
        run: |
          # Interpolation requires the same variables the stack demands
          # locally (`:?` guards); dummies are enough to prove the model is
          # valid — no container starts here.
          env MYSQL_PASSWORD=dummy MYSQL_ROOT_PASSWORD=dummy \
            MINIO_ACCESS_KEY=dummy MINIO_SECRET_KEY=dummy \
            GRAFANA_ADMIN_PASSWORD=dummy \
            METRICS_TOKEN=dummy \
            docker compose --profile observability config --quiet

      - name: Static check (no secrets, all ports on 127.0.0.1)
        run: node tooling/scripts/check-observability.mjs

      - name: Tooling unit tests
        run: node --test tooling/scripts/obs/*.test.mjs

  # ---------------------------------------------------------------
  # 6) یه چک نهایی که توی branch protection به‌عنوان required ست کن
  #    (چون jobهای شرطی ممکنه skip بشن)
  # ---------------------------------------------------------------
  ci-status:
    name: CI status
    needs: [changes, frontend, backend, dockerfile-lint, observability]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all jobs
        run: |
          echo "changes:         ${{ needs.changes.result }}"
          echo "frontend:        ${{ needs.frontend.result }}"
          echo "backend:         ${{ needs.backend.result }}"
          echo "dockerfile-lint: ${{ needs.dockerfile-lint.result }}"

          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "All good"
