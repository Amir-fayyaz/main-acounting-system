name: Deploy MVP Design to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/frontend/mvp-design/**'
      - '.github/workflows/deploy-mvp-design.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mvp-design
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mvp-design
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/frontend/mvp-design'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
