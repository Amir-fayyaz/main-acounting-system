name: Setup Node & pnpm
description: Setup pnpm + Node (cached) and install dependencies with a frozen lockfile

runs:
  using: composite
  steps:
    # نسخه‌ی pnpm از فیلد "packageManager" توی package.json خونده میشه
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    # نسخه‌ی Node از .nvmrc خونده میشه
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile
